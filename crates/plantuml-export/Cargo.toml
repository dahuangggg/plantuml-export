[package]
name = "plantuml-export-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native PlantUML export, validation, and diagnostic toolchain"

[lib]
name = "plantuml_export"
path = "src/lib.rs"

[[bin]]
name = "plantuml-export"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
url = "2"

[dev-dependencies]
tempfile = "3"
